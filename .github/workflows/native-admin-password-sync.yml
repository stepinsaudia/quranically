name: SYNC QURANICALLY ADMIN PASSWORD — no code or DB deployment
on:
  push:
    branches: [main]
    paths:
      - '.github/qst-admin-password-sync.txt'
permissions:
  contents: read
concurrency:
  group: quranically-native-admin
  cancel-in-progress: false
jobs:
  password-sync:
    if: ${{ github.event.head_commit.message == 'AUTHORIZE QURANICALLY ADMIN PASSWORD SYNC' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm ONLY existing Quranically Worker and D1 target
        run: node scripts/native-admin-preflight.mjs
      - name: Prepare tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate new private Admin password before modifying Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          QST_ADMIN_PASSWORD: ${{ secrets.QST_ADMIN_PASSWORD }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare token; nothing changed'; exit 1; }
          node scripts/make-native-admin-record.mjs > /dev/null
          echo 'Private password validated without logging its value.'
      - name: Replace password verifier on existing Quranically Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
          QST_ADMIN_PASSWORD: ${{ secrets.QST_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/make-native-admin-record.mjs | npx wrangler secret put ADMIN_PASSWORD_RECORD
      - name: Verify live Admin sign-in, session, logout and public health
        env:
          QST_ADMIN_PASSWORD: ${{ secrets.QST_ADMIN_PASSWORD }}
        run: node scripts/native-admin-live-check.mjs
