name: CI — Quran Knowledge application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler locally
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify application and bootstrap script
        run: |
          node --check src/index.mjs
          node --check scripts/github-bootstrap.mjs
          node --check public/app.js
          node --check public/admin.js
          node --check public/tibb.js
          node --check public/encyclopedia.js
          node --check scripts/encyclopedia-live-check.mjs
          node --check scripts/tibb-live-check.mjs
      - name: Run route and database tests
        run: npm test

  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live frontend, API, database and Admin protection (GET only)
        run: node scripts/live-smoke.mjs
      - name: Diagnose native Admin live routing (GET only)
        run: node scripts/native-admin-probe.mjs
