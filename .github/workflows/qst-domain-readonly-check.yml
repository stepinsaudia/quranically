name: Quranically — one-time read-only Cloudflare domain readiness
on:
  push:
    branches: [fix/relevant-source-search-20261029]
    paths:
      - 'release/QST_DOMAIN_PROBE_20261031.txt'
permissions:
  contents: read
jobs:
  inspect-domain-without-changing-dns:
    if: ${{ github.event.head_commit.message == 'RUN QURANICALLY CLOUDFLARE DOMAIN READONLY CHECK' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check existing Cloudflare account, zone, hostname and Worker with zero writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          const account=c.account_id;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!token)throw Error('Existing GitHub Cloudflare credential unavailable');
          const headers={Authorization:'Bearer '+token,Accept:'application/json'};
          async function read(url){
            const r=await fetch(url,{headers,signal:AbortSignal.timeout(15000)});
            const j=await r.json().catch(()=>({}));
            return {http:r.status,success:j.success,result:j.result,errors:j.errors?.map(e=>e.code)||[]};
          }
          const base='https://api.cloudflare.com/client/v4';
          const zone=await read(base+'/zones?name=businessinsaudi.com&per_page=20');
          const found=Array.isArray(zone.result)?zone.result:[];
          const owned=found.filter(z=>z.name==='businessinsaudi.com'&&z.account?.id===account);
          console.log('CLOUDFLARE_ZONE_STATUS',JSON.stringify({http:zone.http,success:zone.success,matchingZones:found.length,exactAccountZones:owned.length,zones:found.map(z=>({name:z.name,status:z.status,plan:z.plan?.name,account_matches:z.account?.id===account,name_servers:z.name_servers}))}));
          const worker=await read(base+'/accounts/'+account+'/workers/scripts/'+c.name+'/settings');
          console.log('WORKER_STATUS',JSON.stringify({http:worker.http,success:worker.success,script:c.name}));
          if(owned.length){
            for(const z of owned){
              const records=await read(base+'/zones/'+z.id+'/dns_records?name=quranically.businessinsaudi.com&per_page=20');
              console.log('TARGET_RECORD_CHECK',JSON.stringify({http:records.http,success:records.success,count:Array.isArray(records.result)?records.result.length:0,types:Array.isArray(records.result)?records.result.map(e=>e.type):[]}));
            }
          }else console.log('DOMAIN_NOT_ACTIVE_IN_SAME_ACCOUNT_OR_ZONE_READ_DENIED');
          JS
