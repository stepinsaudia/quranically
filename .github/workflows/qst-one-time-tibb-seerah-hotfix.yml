name: QURANICALLY — One-time Tibb redirect and Seerah answer hotfix
on:
  push:
    branches: [fix/relevant-source-search-20261029]
    paths:
      - 'release/QST_TIBB_SEERAH_HOTFIX_20261031.txt'
permissions:
  contents: read
concurrency:
  group: quranically-native-admin
  cancel-in-progress: false
jobs:
  deploy-original-worker-only:
    if: ${{ github.event.head_commit.message == 'AUTHORIZE QST TIBB SEERAH HOTFIX 2026-10-31' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact source candidate and one-time approval
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~2)" = '60bf4f5a7209c8d587983ad44995169f68ab5a39' || { echo 'Source diverged from tested candidate'; exit 1; }
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = 'release/QST_TIBB_SEERAH_HOTFIX_20261031.txt' || { echo 'Unapproved marker commit'; exit 1; }
          test "$(git diff-tree --no-commit-id --name-only -r HEAD~1)" = '.github/workflows/qst-one-time-tibb-seerah-hotfix.yml' || { echo 'Source edit after acceptance'; exit 1; }
          test "$(cat release/QST_TIBB_SEERAH_HOTFIX_20261031.txt)" = 'Quranically owner authorized repair of existing Worker /tibb redirect loop, Tibb on-page source search, and Seerah answer layout. No D1 changes.' || exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact original Cloudflare Worker and D1
        run: node scripts/native-admin-preflight.mjs
      - name: Test and compile complete application before production
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --check src/index.mjs
          node --check public/tibb.js
          node --check public/encyclopedia.js
          npm test
          npx wrangler deploy --dry-run
      - name: Check live Worker identity and pre-existing database without writing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+c.account_id+'/workers/scripts/'+c.name+'/settings',{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});
          if(!response.ok)throw Error('Existing Worker not found');
          const data=await response.json(),binding=data.result?.bindings?.find(x=>x.name==='DB'&&x.type==='d1');
          if(!data.success||String(binding?.database_id||binding?.id)!==c.d1_databases[0].database_id)throw Error('Original D1 binding mismatch');
          console.log('PASS: exact existing Worker and D1 unchanged');
          JS
      - name: Deploy corrected files to EXISTING Worker — no database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: npx wrangler deploy
      - name: Verify LIVE Tibb navigation, practical medicine and Seerah
        run: |
          node --input-type=module <<'JS'
          const root='https://qst-living-knowledge-v1.stepinsaudia.workers.dev';
          const routes=['/','/tibb','/tibb?q=diabetes','/tibb?entry=black-seed','/encyclopedia?domain=seerah&q=Hijrah','/api/tibb','/api/tibb/black-seed','/api/health'];
          for(const route of routes){
            const response=await fetch(root+route,{redirect:'follow',signal:AbortSignal.timeout(20000)});
            if(response.status!==200)throw Error('Bad route '+route+' HTTP '+response.status);
            if(route.startsWith('/tibb')){
              const html=await response.text();
              if(!html.includes('id="entryGrid"')||!html.includes('id="tibbAnswerShell"'))throw Error('Tibb source content missing '+route);
            }else if(route==='/api/tibb/black-seed'){
              const j=await response.json();
              if(j.entry?.slug!=='black-seed'||!j.guide?.daily_life_use)throw Error('No practical black seed guide');
            }else if(route==='/api/tibb'){
              const j=await response.json();
              if((j.entries||[]).length<8)throw Error('Tibb catalogue missing');
            }else if(route.startsWith('/encyclopedia')){
              if(!(await response.text()).includes('id="inlineAnswer"'))throw Error('Seerah answer missing');
            }
            console.log('LIVE PASS',route);
          }
          JS
