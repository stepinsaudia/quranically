name: QURANICALLY — existing Worker visual review
on:
  push:
    branches: [main]
    paths:
      - '.github/qst-visual-review-authorize.txt'
permissions:
  contents: read
concurrency:
  group: quranically-native-admin
  cancel-in-progress: false
jobs:
  review:
    if: ${{ github.event.head_commit.message == 'AUTHORIZE QURANICALLY WORKER VISUAL REVIEW' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out tested canonical review commit
        uses: actions/checkout@v4
        with:
          ref: caa983e4ec3176c06cb9c5ed6793547c843fa78a
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm only existing Quranically Worker and D1
        run: node scripts/native-admin-preflight.mjs
      - name: Install controlled dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Test pinned review commit
        run: |
          npm test
          node --check src/index.mjs
          node --check src/site-shell.mjs
          node --check src/source-discovery.mjs
          node --check src/hadeethenc-library.mjs
          node --check public/source-shelves.js
          node --check public/answer.js
          node --check public/encyclopedia.js
          node --check public/admin.js
          node --check public/site-chrome.js
          node --check public/media-admin.js
      - name: Verify private Cloudflare deployment permission
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No Cloudflare token configured; live Worker remains untouched."
            exit 1
          fi
      - name: Confirm current remote D1 and capture private pre-review backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list qst-knowledge-v1-db --remote
          umask 077
          npx wrangler d1 export qst-knowledge-v1-db --remote --output=/tmp/quranically-review-backup.sql >/dev/null
          test -s /tmp/quranically-review-backup.sql
          echo "Private D1 backup captured in ephemeral runner (not uploaded)."
      - name: Apply only additive canonical migrations to existing D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: npx wrangler d1 migrations apply qst-knowledge-v1-db --remote
      - name: Deploy the existing Quranically Worker (no second Worker)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: npx wrangler deploy
      - name: Read-only live deployment acceptance
        run: |
          node --input-type=module <<'JS'
          const origin='https://qst-living-knowledge-v1.stepinsaudia.workers.dev';
          const grab=async p=>{
            const r=await fetch(origin+p,{headers:{accept:'application/json'},signal:AbortSignal.timeout(20000)});
            if(!r.ok)throw Error(p+': HTTP '+r.status);
            return r;
          };
          const home=await (await grab('/')).text();
          if(!home.includes('quranically-theme.css')||!home.includes('site-chrome.js'))throw Error('New shared frontend missing');
          if((home.match(/<header class="qst-shell-header"/g)||[]).length!==1||!home.includes('data-canonical-shell="server"'))throw Error('Canonical header not present in initial HTML');
          if(home.includes('<header class="header">')||home.includes('<nav class="global-nav">'))throw Error('Legacy header still leaking into HTML');
          if((home.match(/<footer class="qst-shell-footer"/g)||[]).length!==1)throw Error('Canonical footer absent');
          const chrome=await (await grab('/api/site-chrome')).json();
          if((chrome.homepage_cards||[]).length!==5||(chrome.panels||[]).length!==3)throw Error('Canonical site content not present');
          const disc=await (await grab('/api/discipline-pages')).json();
          if((disc.pages||[]).length!==5||(disc.pathways||[]).length<20)throw Error('Discipline pages/pathways incomplete');
          const answer=await (await grab('/api/encyclopedia/answer?domain=prophetic_medicine&q=ginger')).json();
          if(answer.outcome!=='full_article_answer')throw Error('Prophetic Medicine on-page answer failed');
          for(const [domain,q] of [['sunnah','fasting'],['seerah','clothing for men'],['prophetic_medicine','honey'],['living_guidance','patience']]){
            const qs=new URLSearchParams({domain,q});
            const probe=await (await grab('/api/source-discovery?'+qs)).json();
            if(!probe.providers?.length||!probe.results?.length)throw Error('No live source retrieval for '+domain+' / '+q);
            if(probe.results.some(x=>!x.source_url||!x.excerpt))throw Error('Unattributed external source record: '+domain);
            if(domain==='prophetic_medicine'&&!probe.providers.some(x=>x.id==='europe_pmc'))throw Error('Missing medical bibliography provider status');
            console.log('LIVE SOURCE FETCH',domain,probe.results.length,'records; statuses',probe.providers.map(p=>p.id+':'+p.status).join(','));
          }
          for(const domain of ['sunnah','seerah','prophetic_medicine','living_guidance']){
            const shelves=await (await grab('/api/source-shelves?domain='+domain)).json();
            if(shelves.source!=='canonical_d1'||!shelves.shelves?.length)throw Error('Missing canonical source shelves for '+domain);
            const featured=shelves.shelves[0];
            const params=new URLSearchParams({domain,shelf:featured.id});
            const library=await (await grab('/api/source-shelves/records?'+params)).json();
            if(library.status!=='available'||!library.records?.length)throw Error('Live HadeethEnc category unavailable for '+domain+' / '+featured.heading);
            const id=library.records[0].id;
            const detail=await (await grab('/api/source-shelves/detail?id='+id)).json();
            if(detail.status!=='available'||!detail.passage||!detail.source_url)throw Error('Publisher detail unavailable for '+id);
            console.log('LIVE PUBLISHER LIBRARY',domain,'shelves',shelves.shelves.length,'reports',library.records.length,'detail',id);
          }
          const categoryTree=await (await grab('/api/source-shelves/tree?domain=seerah')).json();
          if(categoryTree.status!=='available'||!categoryTree.categories?.length)throw Error('Full official Seerah category tree unavailable');
          if(!categoryTree.categories.some(x=>(x.shelf_roots||[]).includes('7')))throw Error('Publisher category hierarchy missing approved ancestry');
          const deep=await (await grab('/api/source-shelves/records?domain=sunnah&shelf=sunnah-virtues&page=21')).json();
          if(deep.status!=='available'||deep.page!==21||!deep.records?.length||deep.page_size!==20)throw Error('Full source pagination still limited to preview');
          console.log('FULL LIBRARY HIERARCHY',categoryTree.categories.length,'categories; page 21',deep.records.length,'records');
          const admin=await fetch(origin+'/api/admin/bootstrap',{signal:AbortSignal.timeout(20000)});
          if(![401,403,503].includes(admin.status))throw Error('Admin access not protected');
          for(const domain of ['quranic_themes','sunnah','seerah','prophetic_medicine','living_guidance']){
            const r=await grab('/encyclopedia?domain='+domain);
            const html=await r.text();
            if(!html.includes('disciplineLanding'))throw Error('Discipline frontend missing: '+domain);
          }
          console.log('LIVE REVIEW PASS — '+origin);
          JS
      - name: Discard ephemeral backup
        if: always()
        run: rm -f /tmp/quranically-review-backup.sql
