name: Quranically Header Regression
on:
  push:
    branches:
      - main
      - fix/relevant-source-search-20261029
  pull_request:
    branches:
      - main
jobs:
  header-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run canonical header structural tests
        run: node --test tests/header.test.mjs
