name: Quranically — prepare free pending Cloudflare DNS zone safely
on:
  push:
    branches: [fix/relevant-source-search-20261029]
    paths:
      - 'release/QST_DOMAIN_ZONE_PREPARE_20261031.txt'
permissions:
  contents: read
jobs:
  prepare-inactive-zone-only:
    if: ${{ github.event.head_commit.message == 'PREPARE FREE PENDING CLOUDFLARE ZONE FOR QURANICALLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add only PENDING full DNS zone in existing free account; do not affect authoritative DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          const account=config.account_id;
          const domain='businessinsaudi.com';
          const base='https://api.cloudflare.com/client/v4';
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,Accept:'application/json','Content-Type':'application/json'};
          const list=await fetch(base+'/zones?name='+domain,{headers,signal:AbortSignal.timeout(14000)});
          const listed=await list.json();
          if(!list.ok||!listed.success)throw Error('Unable to check existing zones. No changes made.');
          let zone=(listed.result||[]).find(x=>x.name===domain&&x.account?.id===account);
          if(!zone){
            const response=await fetch(base+'/zones',{method:'POST',headers,
              body:JSON.stringify({name:domain,account:{id:account},type:'full'}),signal:AbortSignal.timeout(14000)});
            const created=await response.json();
            if(!response.ok||!created.success){
              console.log('ZONE_CREATION_BLOCKED',JSON.stringify({http:response.status,errors:(created.errors||[]).map(x=>({code:x.code,message:x.message}))}));
              process.exit(2);
            }
            zone=created.result;
            console.log('CLOUDFLARE_ZONE_CREATED_PENDING',JSON.stringify({name:zone.name,status:zone.status,type:zone.type,name_servers:zone.name_servers,plan:zone.plan?.name}));
          }else console.log('ZONE_ALREADY_PRESENT',JSON.stringify({name:zone.name,status:zone.status,type:zone.type,name_servers:zone.name_servers,plan:zone.plan?.name}));
          if(zone.name!==domain||zone.account?.id!==account)throw Error('Unexpected account or zone identity');
          if(zone.plan?.name&&zone.plan.name.toLowerCase()!=='free')throw Error('Zone not on FREE plan. No DNS or Worker changes will occur.');
          if(zone.status!=='pending'&&zone.status!=='active')throw Error('Unexpected zone state '+zone.status);
          console.log('NO_NAMESERVER_CHANGES_NO_DNS_CHANGES_NO_WORKER_CHANGES');
          // Cloudflare DNS scan is advisory only. Do not accept partial records automatically.
          const scan=await fetch(base+'/zones/'+zone.id+'/dns_records/scan/trigger',{method:'POST',headers,signal:AbortSignal.timeout(12000)});
          console.log('DNS_RECORD_DISCOVERY_REQUEST',JSON.stringify({http:scan.status,accepted:scan.ok}));
          console.log('NEED_MANUAL_VERIFICATION_OF_WEBSITE_EMAIL_MX_TXT_DKIM_SPF_DMARCC_BEFORE_GODADDY_NAMESERVER_CHANGE');
          JS
