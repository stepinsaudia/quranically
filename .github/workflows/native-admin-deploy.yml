name: ACTIVATE QURANICALLY NATIVE ADMIN — existing Worker only
on:
  push:
    branches: [main]
    paths:
      - '.github/qst-native-admin-authorize.txt'
permissions:
  contents: read
concurrency:
  group: quranically-native-admin
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event.head_commit.message == 'AUTHORIZE QURANICALLY NATIVE ADMIN DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing isolated resources only
        run: node scripts/native-admin-preflight.mjs
      - name: Install tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Automated tests
        run: npm test
      - name: Apply native Admin session migration to existing D1 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: npx wrangler d1 migrations apply qst-knowledge-v1-db --remote
      - name: Deploy updated Quranically Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: npx wrangler deploy
      - name: Store only derived password verifier in Cloudflare Secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
          QST_ADMIN_PASSWORD: ${{ secrets.QST_ADMIN_PASSWORD }}
        run: node scripts/make-native-admin-record.mjs | npx wrangler secret put ADMIN_PASSWORD_RECORD
      - name: Check live Admin sign-in and sign-out
        env:
          QST_ADMIN_PASSWORD: ${{ secrets.QST_ADMIN_PASSWORD }}
        run: node scripts/native-admin-live-check.mjs
