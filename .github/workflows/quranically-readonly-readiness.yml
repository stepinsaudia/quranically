name: Quranically — Read-only Production Readiness
on:
  pull_request:
    paths: [.github/workflows/quranically-readonly-readiness.yml, .github/workflows/quranically-promote-dossiers.yml]
  push:
    branches: [fix/relevant-source-search-20261029]
    paths: [.github/workflows/quranically-readonly-readiness.yml]
permissions:
  contents: read
jobs:
  inspect-existing-resources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical Worker and database identity
        run: node scripts/native-admin-preflight.mjs
      - name: Install Wrangler only; no deployment
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Confirm existing production database contents (READ ONLY)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'No Cloudflare token is connected in GitHub Actions'; exit 1; }
          npx wrangler d1 execute qst-knowledge-v1-db --remote --json --command="SELECT (SELECT COUNT(*) FROM encyclopedia_articles WHERE status='published') AS articles, (SELECT COUNT(*) FROM tibb_entries WHERE status='published') AS tibb, (SELECT COUNT(*) FROM encyclopedia_citations) AS citations, (SELECT COUNT(*) FROM encyclopedia_articles WHERE slug IN ('diabetes-and-prophetic-medicine','mens-clothing-prophetic-era') AND status='published') AS critical_answers, (SELECT COUNT(*) FROM encyclopedia_articles WHERE slug IN ('hijrah-to-madinah','battle-of-badr-sourced-account','prophetic-guidance-neighbours','anger-and-self-restraint','repentance-tawbah-in-islam','family-relationships-kindness','honey-for-cough-evidence','hijama-cupping-safety','asthma-prophetic-medicine-boundaries','patience-quranic-theme','riba-in-quranic-text','maryam-in-quran','truthfulness-in-sunnah','backbiting-ghibah-sunnah','ayat-al-kursi-guide') AND status='published') AS new_dossiers;" > /tmp/qst-audit.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const results=JSON.parse(fs.readFileSync('/tmp/qst-audit.json','utf8'));
          const x=Array.isArray(results)?results[0]?.results?.[0]:null;
          if(!x)throw Error('Remote D1 did not return expected read-only record counts');
          for(const [key,val] of Object.entries(x))console.log(key+': '+val);
          const good=Number(x.articles)>=17&&Number(x.tibb)>=8&&Number(x.citations)>=15&&Number(x.critical_answers)===2;
          const contentReady=Number(x.new_dossiers)===15;
          console.log('Release content status:',contentReady?'MIGRATED':'PENDING ('+x.new_dossiers+'/15 dossiers)');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### Quranically existing D1 read-only audit\n\n'+Object.entries(x).map(([k,v])=>'- '+k+': '+v).join('\n')+'\n\nStatus: '+(good?(contentReady?'INFRASTRUCTURE AND NEW DOSSIERS READY':'INFRASTRUCTURE READY; NEW DOSSIER DATA MIGRATION PENDING'):'BASELINE DATABASE NOT READY')+'\n');
          if(!good)throw Error('Existing production content is not ready; deploy blocked and no data changed.');
          JS
      - name: Read-only public Worker status
        run: node scripts/live-smoke.mjs
      - name: Observe full Quranically frontend rollout without modifying anything
        run: |
          node --input-type=module <<'JS'
          const root='https://qst-living-knowledge-v1.stepinsaudia.workers.dev';
          let last='unknown';
          for(let i=1;i<=10;i++){
            try{
              const [v,a]=await Promise.all([
                fetch(root+'/api/quran/search?q=patience&limit=12',{signal:AbortSignal.timeout(18000)}),
                fetch(root+'/api/encyclopedia/answer?domain=seerah&q=What%20happened%20at%20the%20Battle%20of%20Badr%3F',{signal:AbortSignal.timeout(18000)})
              ]);
              if(!v.ok||!a.ok)throw Error('HTTP '+v.status+', '+a.status);
              const [verses,article]=await Promise.all([v.json(),a.json()]);
              if(verses.source_corpus?.verses!==6236||verses.results?.length!==12||article.answer?.slug!=='battle-of-badr-sourced-account')
                throw Error('Live Worker still serves old or incomplete source engine.');
              console.log('LIVE EXISTING WORKER VERIFIED: Quran 6236-verse search and sourced Badr article are operational.');
              process.exit(0);
            }catch(e){last=String(e.message||e);console.log('Live verification attempt '+i+'/10:',last);}
            await new Promise(resolve=>setTimeout(resolve,12000));
          }
          throw Error('Live source engine did not pass independent read-only verification: '+last);
          JS

