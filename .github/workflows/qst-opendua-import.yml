name: Quranically — import complete OpenDua Hisn al-Muslim corpus to existing D1
on:
  push:
    branches: [main]
    paths: ['.github/qst-opendua-import-authorize.txt']
permissions:
  contents: read
concurrency:
  group: quranically-native-admin
  cancel-in-progress: false
jobs:
  open-dua-import:
    if: ${{ github.event.head_commit.message == 'AUTHORIZE QURANICALLY OPEN DUA CORPUS IMPORT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f23ba3fb566e35ab2517f8b6ccda29b565f09443
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify isolated canonical tests and existing D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: |
          set -euo pipefail
          npm install --no-package-lock --no-audit --no-fund
          npm test
          npx wrangler d1 migrations list qst-knowledge-v1-db --remote
          npx wrangler d1 execute qst-knowledge-v1-db --remote --command="SELECT COUNT(*) AS n FROM knowledge_sources WHERE id='opendua-en';" --yes
      - name: Retrieve and preserve exact official edition v0.0.4 without audio
        run: |
          set -euo pipefail
          QST_CORPUS_CHUNK_DIR=/tmp/quranically-opendua node scripts/build-opendua-corpus.mjs
      - name: Verify exact 267 record source IDs, searchable text and full publisher JSON
        run: |
          python3 - <<'PY'
          import sqlite3,pathlib,json
          db=sqlite3.connect(':memory:')
          for m in ('0024_knowledge_corpus_inverted_index.sql','0025_complete_publisher_record.sql'):
              db.executescript(pathlib.Path('migrations',m).read_text())
          files=sorted(pathlib.Path('/tmp/quranically-opendua').glob('corpus-part-*.sql'))
          assert len(files)==27,len(files)
          for f in files:
              with f.open('rb') as stream: longest=max(map(len,stream),default=0)
              assert longest<7000,(f,longest)
              db.executescript(f.read_text())
          row=db.execute("""SELECT COUNT(*),COUNT(DISTINCT external_ref),
            SUM(LENGTH(publisher_record_json)>200),
            SUM(LENGTH(translation_text)>0),
            SUM(LENGTH(normalized_search)>0)
            FROM knowledge_passages WHERE source_id='opendua-en' AND status='published'""").fetchone()
          assert row[0]==267 and row[1]==267 and row[2]==267 and row[3]>=200 and row[4]==267,row
          print('FULL OPEN DUA SOURCE VALIDATION PASS',json.dumps({'records':row[0],'distinct':row[1],'full_context':row[2],'translated':row[3],'indexed':row[4]}))
          PY
      - name: Create private D1 pre-import snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: |
          set -euo pipefail
          umask 077
          npx wrangler d1 export qst-knowledge-v1-db --remote --output=/tmp/qst-pre-opendua-backup.sql >/dev/null
          test -s /tmp/qst-pre-opendua-backup.sql
          echo "Private export verified in ephemeral runner."
      - name: Idempotent import of all 27 source batches to the existing D1 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: |
          set -euo pipefail
          n=0
          for f in /tmp/quranically-opendua/corpus-part-*.sql; do
            n=$((n+1))
            npx wrangler d1 execute qst-knowledge-v1-db --remote --file="$f" --yes >/tmp/qst-opendua-log 2>&1 || {
              tail -60 /tmp/qst-opendua-log
              echo "Stopped after batch $n; completed batches may be replayed safely."
              exit 1
            }
            echo "Imported complete source batch $n/27"
          done
      - name: Verify all 267 original contextual entries exist on the live Worker
        run: |
          node --input-type=module <<'JS'
          const base='https://qst-living-knowledge-v1.stepinsaudia.workers.dev';
          const res=await fetch(base+'/api/knowledge/coverage',{signal:AbortSignal.timeout(25000)});
          if(!res.ok)throw Error('Live coverage HTTP '+res.status);
          const coverage=await res.json();
          const opendua=coverage.sources.find(x=>x.id==='opendua-en');
          const hadith=coverage.sources.find(x=>x.id==='hadeethenc-en');
          if(opendua?.available_in_index!==267||hadith?.available_in_index!==2328)throw Error('Combined corpus counts mismatch: '+JSON.stringify({opendua,hadith}));
          console.log('FULL CORPUS VERIFIED: OpenDua 267 complete contextual entries plus 2328 HadeethEnc originals.');
          JS
      - name: Destroy ephemeral publisher files and backup
        if: always()
        run: rm -rf /tmp/quranically-opendua /tmp/qst-opendua-log /tmp/qst-pre-opendua-backup.sql
