name: QURANICALLY — Deploy tested build to EXISTING Worker
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY EXISTING QURANICALLY to authorize the live update'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: quranically-native-admin
  cancel-in-progress: false
jobs:
  existing-worker-only:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.confirmation == 'DEPLOY EXISTING QURANICALLY' && github.ref_name == 'fix/relevant-source-search-20261029') || (github.event_name == 'push' && github.ref_name == 'fix/relevant-source-search-20261029' && github.event.head_commit.message == 'AUTHORIZE QURANICALLY LIVE WORKER RELEASE 2026-10-31') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out approved Quranically development branch ONLY
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate explicit one-time authorization and frozen source candidate
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          test "$(cat release/QURANICALLY_RELEASE_AUTHORIZED_2026-10-31.txt)" = 'Approved by Quranically owner in chat on 2026-10-31: deploy the existing Worker with guarded D1 migrations only. Confirmed retry after validation-guard repair.'
          changed_files="$(git diff --name-only c3cd1ae2f9e9daa43cef3f102ae29aa99bf6c1c4 HEAD)"
          test "$(printf '%s\n' "$changed_files" | sed '/^$/d' | wc -l)" -eq 2 || { echo 'Unexpected number of changed files since approval'; exit 1; }
          printf '%s\n' "$changed_files" | grep -qxF '.github/workflows/quranically-existing-worker-release.yml' || exit 1
          printf '%s\n' "$changed_files" | grep -qxF 'release/QURANICALLY_RELEASE_AUTHORIZED_2026-10-31.txt' || exit 1
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "$changed" = 'release/QURANICALLY_RELEASE_AUTHORIZED_2026-10-31.txt' || { echo 'Release marker must be the only changed file.'; exit 1; }
          echo 'Explicit one-time approval and frozen candidate verified.'
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check known Worker and D1 configuration (no provisioning)
        run: node scripts/native-admin-preflight.mjs
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check syntax and application behavior BEFORE deployment
        run: |
          node --check src/index.mjs
          node --check public/answer.js
          node --check public/encyclopedia.js
          npm test
          npx wrangler deploy --dry-run
      - name: Confirm Cloudflare credential and EXISTING Worker (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN GitHub Actions secret'; exit 1; }
          node --input-type=module -e '
            import fs from "node:fs";
            const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));
            const endpoint="https://api.cloudflare.com/client/v4/accounts/"+encodeURIComponent(c.account_id)+"/workers/scripts/"+encodeURIComponent(c.name)+"/settings";
            const r=await fetch(endpoint,{headers:{Authorization:"Bearer "+process.env.CLOUDFLARE_API_TOKEN,Accept:"application/json"}});
            if(!r.ok){console.error("Existing Worker settings unavailable ("+r.status+"); deployment blocked.");process.exit(1);}
            const body=await r.json().catch(()=>null);
            if(body?.success!==true){console.error("Unable to verify existing Worker settings; deployment blocked.");process.exit(1);}
            const expected=c.d1_databases?.[0];
            const db=body.result?.bindings?.find(b=>b.name===expected?.binding&&b.type==="d1");
            if(!db||String(db.database_id||db.id)!==expected.database_id){console.error("Existing D1 binding differs from approved database; deployment blocked.");process.exit(1);}
            console.log("Confirmed existing Worker settings and exact D1 binding.");
          '
      - name: Refuse to publish an empty or unseeded knowledge database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: |
          set -euo pipefail
          npx wrangler d1 execute qst-knowledge-v1-db --remote --json --command="SELECT (SELECT COUNT(*) FROM encyclopedia_articles WHERE status='published') AS articles, (SELECT COUNT(*) FROM tibb_entries WHERE status='published') AS tibb, (SELECT COUNT(*) FROM encyclopedia_citations) AS citations, (SELECT COUNT(*) FROM encyclopedia_articles WHERE slug IN ('diabetes-and-prophetic-medicine','mens-clothing-prophetic-era') AND status='published') AS critical_answers, (SELECT COUNT(*) FROM encyclopedia_articles WHERE slug IN ('hijrah-to-madinah','battle-of-badr-sourced-account','prophetic-guidance-neighbours','anger-and-self-restraint','repentance-tawbah-in-islam','family-relationships-kindness','honey-for-cough-evidence','hijama-cupping-safety','asthma-prophetic-medicine-boundaries','patience-quranic-theme','riba-in-quranic-text','maryam-in-quran','truthfulness-in-sunnah','backbiting-ghibah-sunnah','ayat-al-kursi-guide') AND status='published') AS new_dossiers;" > /tmp/qst-release-readonly.json
          node --input-type=module -e '
            import fs from "node:fs";
            const data=JSON.parse(fs.readFileSync("/tmp/qst-release-readonly.json","utf8"));
            const check=Array.isArray(data)?data[0]?.results?.[0]:null;
            if(!check||Number(check.articles)<17||Number(check.tibb)<8||Number(check.citations)<15||Number(check.critical_answers)!==2||Number(check.new_dossiers)!==15){console.error("Missing published knowledge records or 15 verified source dossiers; deploy refused without modifying D1.");process.exit(1);}
            console.log("Verified existing D1 contains published articles, Prophetic Medicine, citations, and both tested real-world answers.");
          '
      - name: Backup original D1 and install ONLY additive private research schema if absent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: |
          set -euo pipefail
          # Never modify any other schema or content. A populated research table
          # is verified by the next gate; it is never overwritten.
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const sql=fs.readFileSync('migrations/0019_research_topics.sql','utf8');
          const inserts=(sql.match(/^INSERT OR IGNORE INTO research_topics\(/gm)||[]).length;
          const statements=sql.split(';').map(x=>x.trim()).filter(Boolean)
            .map(x=>x.replace(/^(?:--[^\n]*\n\s*)+/g,'').trim()).filter(Boolean);
          if(inserts!==60 || statements.some(x=>!/^(?:CREATE TABLE IF NOT EXISTS research_topics\b|CREATE (?:UNIQUE )?INDEX IF NOT EXISTS idx_research_topics_\w+\b|INSERT OR IGNORE INTO research_topics\b)/i.test(x))) {
            throw Error('Research migration changed from approved additive-only 60-record schema; deployment refused');
          }
          console.log('Only the approved private research queue migration is eligible for import');
          JS
          npx wrangler d1 execute qst-knowledge-v1-db --remote --json --command="SELECT name FROM sqlite_master WHERE type='table' AND name='research_topics';" > /tmp/quranically-schema-check.json
          if node --input-type=module -e 'import fs from "node:fs";const a=JSON.parse(fs.readFileSync("/tmp/quranically-schema-check.json","utf8"));process.exit(a?.[0]?.results?.some(x=>x.name==="research_topics")?0:1)'; then
            echo 'Research queue already exists; no database migration attempted.'
          else
            umask 077
            npx wrangler d1 export qst-knowledge-v1-db --remote --output=/tmp/quranically-private-pre-release.sql >/dev/null
            test -s /tmp/quranically-private-pre-release.sql || { echo 'Pre-migration database backup failed'; exit 1; }
            echo 'Private existing-D1 backup captured in ephemeral runner; not committed or uploaded.'
            npx wrangler d1 execute qst-knowledge-v1-db --remote --file=migrations/0019_research_topics.sql --yes
          fi
          # Both newly inserted and pre-existing research queue must have exactly
          # the required seed IDs; additional editorial rows are allowed.
          npx wrangler d1 execute qst-knowledge-v1-db --remote --json --command="SELECT COUNT(*) AS n FROM research_topics WHERE id LIKE 'research-%';" > /tmp/quranically-research-count.json
          node --input-type=module -e 'import fs from "node:fs";const a=JSON.parse(fs.readFileSync("/tmp/quranically-research-count.json","utf8"));const n=a?.[0]?.results?.[0]?.n;if(Number(n)<60)throw Error("Research schema incomplete: "+n); console.log("Verified private research records:",n)'
      - name: Require research-topic Admin schema before publishing new code
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: |
          set -euo pipefail
          npx wrangler d1 execute qst-knowledge-v1-db --remote --json --command="SELECT COUNT(*) AS research_topics FROM research_topics;" > /tmp/quranically-research-ready.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('/tmp/quranically-research-ready.json','utf8'))?.[0]?.results?.[0];
          if(!d||Number(d.research_topics)<60)throw Error('Canonical research Admin schema or 60 approved draft queue records missing. Refusing Worker update.');
          console.log('Verified',d.research_topics,'private research topics in existing D1; public content remains review-gated.');
          JS
      - name: Require exact backed-up practical Tibb schema before any Worker promotion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: |
          set -euo pipefail
          test "$(git hash-object migrations/0020_tibb_use_guides.sql)" = "605aa9b99a18613d7a851daea4998f8877d63317" || {
            echo 'Tibb migration changed from approved canonical source; deployment refused.'
            exit 1
          }
          echo 'Approved additive Tibb migration hash verified.'
          npx wrangler d1 execute qst-knowledge-v1-db --remote --json --command="SELECT name FROM sqlite_master WHERE type='table' AND name='tibb_use_guides';" > /tmp/qst-tibb-schema-check.json
          if node --input-type=module -e 'import fs from "node:fs";const r=JSON.parse(fs.readFileSync("/tmp/qst-tibb-schema-check.json","utf8"));process.exit(r?.[0]?.results?.some(x=>x.name==="tibb_use_guides")?0:1)'; then
            echo 'Practical Tibb schema already exists; verify published guide below.'
          else
            umask 077
            npx wrangler d1 export qst-knowledge-v1-db --remote --output=/tmp/quranically-pre-tibb-backup.sql >/dev/null
            test -s /tmp/quranically-pre-tibb-backup.sql || { echo 'Practical Tibb backup failed'; exit 1; }
            npx wrangler d1 execute qst-knowledge-v1-db --remote --file=migrations/0020_tibb_use_guides.sql --yes
          fi
          npx wrangler d1 execute qst-knowledge-v1-db --remote --json --command="SELECT COUNT(*) AS n FROM tibb_use_guides WHERE id='black-seed-use' AND entry_id='black-seed' AND status='published' AND religious_review='pending' AND medical_review='pending' AND LENGTH(primary_url)>10 AND LENGTH(safety_boundaries)>50;" > /tmp/qst-tibb-verified.json
          node --input-type=module -e 'import fs from "node:fs";const r=JSON.parse(fs.readFileSync("/tmp/qst-tibb-verified.json","utf8"));if(Number(r?.[0]?.results?.[0]?.n)!==1)throw Error("Tibb source integrity check failed; Worker deploy blocked");console.log("Verified one safe, provenance-labelled practical black seed guide");'
      - name: Safely stage four canonical discipline learning guides in EXISTING D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: |
          set -euo pipefail
          test "$(git hash-object migrations/0021_discipline_learning_guides.sql)" = "611487ad5bdbb07b907d5222c5858278c9a1d436" || {
            echo 'Discipline learning migration changed; deploy refused'; exit 1;
          }
          npx wrangler d1 execute qst-knowledge-v1-db --remote --json --command="SELECT name FROM sqlite_master WHERE type='table' AND name='discipline_learning_guides';" > /tmp/qst-discipline-schema.json
          if node --input-type=module -e 'import fs from "node:fs";const r=JSON.parse(fs.readFileSync("/tmp/qst-discipline-schema.json","utf8"));process.exit(r?.[0]?.results?.some(x=>x.name==="discipline_learning_guides")?0:1)'; then
            echo 'Canonical discipline learning guides schema already present.'
          else
            umask 077
            npx wrangler d1 export qst-knowledge-v1-db --remote --output=/tmp/quranically-pre-discipline-backup.sql >/dev/null
            test -s /tmp/quranically-pre-discipline-backup.sql || { echo 'Pre-discipline D1 backup failed'; exit 1; }
            npx wrangler d1 execute qst-knowledge-v1-db --remote --file=migrations/0021_discipline_learning_guides.sql --yes
          fi
          npx wrangler d1 execute qst-knowledge-v1-db --remote --json --command="SELECT COUNT(*) AS n FROM discipline_learning_guides g JOIN encyclopedia_citations c ON c.id=g.primary_citation_id AND c.article_id=g.article_id JOIN encyclopedia_articles a ON a.id=g.article_id WHERE g.status='published' AND g.review_status='pending' AND a.status='published' AND a.domain IN ('quranic_themes','sunnah','seerah','living_guidance') AND LENGTH(g.source_teaching)>30 AND LENGTH(g.everyday_application)>30 AND LENGTH(g.boundaries)>30;" > /tmp/qst-discipline-verified.json
          node --input-type=module -e 'import fs from "node:fs";const r=JSON.parse(fs.readFileSync("/tmp/qst-discipline-verified.json","utf8"));const n=Number(r?.[0]?.results?.[0]?.n);if(n<4)throw Error("Four canonical discipline guides missing; deploy refused");console.log("Verified four same-source editorial learning guides",n)'
      - name: Deploy to EXACT existing Quranically Worker (only verified additive migrations 0019, 0020, 0021)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: npx wrangler deploy
      - name: Read-only live release smoke check
        run: |
          node --input-type=module -e '
            const root="https://qst-living-knowledge-v1.stepinsaudia.workers.dev";
            for(const route of ["/","/study.html","/api/health","/api/unified-search?q=black%20seed"]){
              const r=await fetch(root+route,{signal:AbortSignal.timeout(20000)});
              if(r.status!==200)throw Error("Live check failed at "+route+" ("+r.status+")");
              if(route.includes("unified-search")){
                const data=await r.json();
                if(!Array.isArray(data.tibb)||!data.evidence)throw Error("Unified search response invalid");
              }
              console.log("PASS",route,r.status);
            }
          '
      - name: Remove temporary release backup from runner
        if: always()
        run: rm -f /tmp/quranically-private-pre-release.sql /tmp/quranically-pre-tibb-backup.sql /tmp/qst-tibb-schema-check.json /tmp/qst-tibb-verified.json /tmp/quranically-schema-check.json /tmp/quranically-research-count.json /tmp/quranically-research-ready.json /tmp/qst-release-readonly.json /tmp/quranically-pre-discipline-backup.sql /tmp/qst-discipline-schema.json /tmp/qst-discipline-verified.json
      - name: Record release for review
        run: |
          echo '### Quranically — existing Worker release' >> "$GITHUB_STEP_SUMMARY"
          echo "Git commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Worker: qst-living-knowledge-v1 (existing)' >> "$GITHUB_STEP_SUMMARY"
          echo 'D1: qst-knowledge-v1-db (only approved additive migrations when absent)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Live URL: https://qst-living-knowledge-v1.stepinsaudia.workers.dev' >> "$GITHUB_STEP_SUMMARY"
