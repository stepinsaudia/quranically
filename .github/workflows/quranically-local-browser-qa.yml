name: Quranically — Search-first visual and answer QA (no deployment)
on:
  pull_request:
    paths:
      - '.github/workflows/quranically-local-browser-qa.yml'
      - 'scripts/local-search-visual-qa.mjs'
      - 'scripts/tibb-seerah-real-user-qa.mjs'
      - 'public/qst-visual-system.css'
      - 'public/tibb.js'
      - 'scripts/canonical-release-smoke.mjs'
      - 'public/canonical-header.css'
      - 'public/encyclopedia.js'
      - 'public/answer.js'
      - 'src/index.mjs'
      - 'src/source-discovery.mjs'
      - 'public/study.html'
      - 'public/discipline-learning.js'
      - 'public/reader-learning.js'
      - 'migrations/0021_discipline_learning_guides.sql'
      - 'public/tibb.js'
      - 'public/admin.js'
      - 'public/admin.html'
      - 'migrations/0020_tibb_use_guides.sql'
      - 'tests/worker.test.mjs'
  push:
    branches: [fix/relevant-source-search-20261029]
    paths:
      - '.github/workflows/quranically-local-browser-qa.yml'
      - 'scripts/local-search-visual-qa.mjs'
      - 'scripts/tibb-seerah-real-user-qa.mjs'
      - 'public/qst-visual-system.css'
      - 'public/tibb.js'
      - 'scripts/canonical-release-smoke.mjs'
      - 'public/canonical-header.css'
      - 'public/encyclopedia.js'
      - 'public/answer.js'
      - 'src/index.mjs'
      - 'src/source-discovery.mjs'
      - 'public/study.html'
      - 'public/discipline-learning.js'
      - 'public/reader-learning.js'
      - 'migrations/0021_discipline_learning_guides.sql'
      - 'tests/worker.test.mjs'
permissions:
  contents: read
jobs:
  local-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and local tooling
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Verify source and practical Tibb migrations, API isolation and Admin access
        run: |
          node --check src/index.mjs
          node --check public/tibb.js
          node --check public/discipline-learning.js
          node --check public/reader-learning.js
          node --check public/encyclopedia.js
          node --check public/answer.js
          node --check src/source-discovery.mjs
          node --check public/admin.js
          npm test
      - name: Run local Worker with canonical D1 seed records (no production writes)
        run: |
          node scripts/local-preview.mjs > /tmp/quranically-local-preview.log 2>&1 &
          for i in $(seq 1 25); do
            curl -fsS http://127.0.0.1:8799/ > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8799/api/health
      - name: Verify canonical production release smoke against isolated local preview
        run: node scripts/canonical-release-smoke.mjs
      - name: Browser QA of direct answer, Quran reference, header and mobile overflow
        run: node scripts/local-search-visual-qa.mjs
      - name: Reproduce actual Tibb browsing, black seed details and full-width Seerah Hijrah answer
        run: node scripts/tibb-seerah-real-user-qa.mjs
      - name: Preserve screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quranically-local-search-visual-qa
          path: artifacts/*.png
          if-no-files-found: warn
      - name: Local preview diagnostics if needed
        if: failure()
        run: tail -120 /tmp/quranically-local-preview.log
