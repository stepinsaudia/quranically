name: ACTIVATE QURANICALLY ADMIN — isolated existing Worker
on:
  push:
    branches: [main]
    paths:
      - '.github/qst-admin-activate.txt'
permissions:
  contents: read
concurrency:
  group: quranically-admin-activation
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event.head_commit.message == 'AUTHORIZE QURANICALLY ADMIN ACTIVATION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify only the existing isolated Worker and D1 are targeted
        run: node scripts/admin-release-preflight.mjs
      - name: Install app tooling and run tests
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
      - name: Update existing Quranically Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: npx wrangler deploy
      - name: Verify public API remains healthy
        run: node scripts/live-smoke.mjs
