name: FIRST DEPLOY ONLY — new isolated Cloudflare Worker and D1
run-name: Create NEW Quran Worker and D1 in locked account
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter CREATE NEW QST ONLY to authorize creating ONLY dedicated resources'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: qst-first-deploy-only
  cancel-in-progress: false
jobs:
  first-deploy:
    if: ${{ github.event.inputs.confirmation == 'CREATE NEW QST ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated project
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test before making any Cloudflare changes
        run: npm test
      - name: First-time Cloudflare resource preflight and D1 creation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: node scripts/github-bootstrap.mjs
      - name: Seed only the newly created D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: npx wrangler d1 migrations apply qst-knowledge-v1-db --remote
      - name: Deploy only the new Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: npx wrangler deploy
      - name: First deployment summary
        run: |
          echo '## QST First Deployment' >> "$GITHUB_STEP_SUMMARY"
          echo 'Account: fb9597e74bae3ea18ad7bb013213d776' >> "$GITHUB_STEP_SUMMARY"
          echo 'Worker: qst-living-knowledge-v1' >> "$GITHUB_STEP_SUMMARY"
          echo 'D1: qst-knowledge-v1-db' >> "$GITHUB_STEP_SUMMARY"
          echo 'Admin deliberately locked until Cloudflare Access configuration.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The actual new workers.dev URL is printed in the Wrangler step above.' >> "$GITHUB_STEP_SUMMARY"
