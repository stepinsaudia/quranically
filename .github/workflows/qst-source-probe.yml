name: Quranically Source Provider Connection Probe — read only
on:
  push:
    branches: [main]
    paths:
      - '.github/qst-source-probe-trigger.txt'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/qst-provider-probe.mjs
