name: Quranically — ONE-TIME delegated existing Worker soft release
on:
  push:
    branches: [fix/relevant-source-search-20261029]
    paths:
      - .github/workflows/quranically-one-time-soft-release.yml
permissions:
  contents: read
concurrency:
  group: quranically-native-admin
  cancel-in-progress: false
jobs:
  existing-worker-soft-release:
    if: ${{ github.event_name == 'push' && github.ref_name == 'fix/relevant-source-search-20261029' && github.event.head_commit.message == 'Quranically final controlled release - user delegated' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
    steps:
      - name: Check out exact approved development branch
        uses: actions/checkout@v4
        with:
          ref: fix/relevant-source-search-20261029
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identity guard — no new Worker, no new D1, no custom domain
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/native-admin-preflight.mjs
          test "$(git branch --show-current)" = "fix/relevant-source-search-20261029"
      - name: Test complete Quranically code and new sourced content before release
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          node scripts/prepare-canonical-dossier-batch.mjs
          node --check src/index.mjs
          node --check public/answer.js
          node --check public/encyclopedia.js
          npx wrangler deploy --dry-run
      - name: Verify exact existing Cloudflare Worker binding and capture live rollback version
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const account='fb9597e74bae3ea18ad7bb013213d776',worker='qst-living-knowledge-v1';
          const base='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/'+worker;
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,Accept:'application/json'};
          const get=async url=>{
            const res=await fetch(url,{headers,signal:AbortSignal.timeout(15000)});
            if(!res.ok)throw Error('Cloudflare Worker read-only preflight HTTP '+res.status);
            const json=await res.json();
            if(json.success!==true)throw Error('Cloudflare Worker read-only preflight failed');
            return json.result;
          };
          const settings=await get(base+'/settings');
          const db=settings?.bindings?.find(x=>x.name==='DB'&&x.type==='d1');
          if(String(db?.database_id||db?.id)!=='6c7c8edb-e20c-4354-9d69-0bea89badfd9')throw Error('Unexpected active Worker D1 binding. No deployment.');
          const list=await get(base+'/deployments');
          const deployments=Array.isArray(list)?list:list?.deployments;
          if(!Array.isArray(deployments)||!deployments.length)throw Error('Cannot establish current deployment. No deployment.');
          const latest=deployments[0];
          const versions=latest?.versions;
          if(!Array.isArray(versions)||versions.length!==1||Number(versions[0].percentage)!==100)throw Error('Current deployment is split or unrecognized; manual review required.');
          const version=versions[0].version_id;
          if(!/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(version))throw Error('Unexpected rollback version identifier');
          fs.writeFileSync('/tmp/qst-last-safe-worker-version',version+'\n');
          console.log('Existing Worker configuration verified, prior live version retained for safe rollback: '+version);
          JS
      - name: Verify all 15 source dossiers are already in the existing production D1
        run: |
          set -euo pipefail
          npx wrangler d1 execute qst-knowledge-v1-db --remote --json --command="SELECT (SELECT COUNT(*) FROM encyclopedia_articles WHERE status='published') AS articles,(SELECT COUNT(*) FROM encyclopedia_citations) AS citations,(SELECT COUNT(*) FROM encyclopedia_articles WHERE status='published' AND review_status='editorial_draft' AND slug IN ('hijrah-to-madinah','battle-of-badr-sourced-account','prophetic-guidance-neighbours','anger-and-self-restraint','repentance-tawbah-in-islam','family-relationships-kindness','honey-for-cough-evidence','hijama-cupping-safety','asthma-prophetic-medicine-boundaries','patience-quranic-theme','riba-in-quranic-text','maryam-in-quran','truthfulness-in-sunnah','backbiting-ghibah-sunnah','ayat-al-kursi-guide')) AS dossiers;" > /tmp/qst-release-ready.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('/tmp/qst-release-ready.json','utf8'))?.[0]?.results?.[0];
          if(!d||Number(d.articles)<42||Number(d.citations)<109||Number(d.dossiers)!==15)throw Error('The prepared canonical content is missing from the original D1; refusing deployment.');
          console.log('Pre-release production D1 PASS:',d.articles,'published entries;',d.citations,'source citations;',d.dossiers,'new dossiers');
          JS
      - name: Release exact existing Worker (no D1 changes)
        id: release
        run: npx wrangler deploy
      - name: Smoke-test homepage, Reader, canonical Admin, Quran index, sourced Seerah and Medicine
        id: live_qa
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const origin='https://qst-living-knowledge-v1.stepinsaudia.workers.dev';
          const fetchJson=async (pathname,check)=>{
            let last;
            for(let attempt=0;attempt<3;attempt++){
              try{
                const r=await fetch(origin+pathname,{headers:{accept:'application/json'},signal:AbortSignal.timeout(30000)});
                if(!r.ok)throw Error(pathname+': HTTP '+r.status);
                const data=await r.json();
                if(!check(data))throw Error(pathname+': returned incomplete source-grounded data');
                console.log('PASS',pathname,'(attempt '+(attempt+1)+')');
                return;
              }catch(e){last=e;}
            }
            throw last;
          };
          for(const path of ['/','/study.html','/admin/index.html']){
            const r=await fetch(origin+path,{signal:AbortSignal.timeout(30000)});
            if(!r.ok)throw Error(path+' HTTP '+r.status);
            const text=await r.text();
            if(!text.includes('<html')&&!text.includes('<!doctype'))throw Error(path+' did not serve HTML');
            console.log('PASS',path);
          }
          await fetchJson('/api/health',d=>d.ok===true);
          await fetchJson('/api/quran/search?q=patience&limit=12',d=>d.source_corpus?.verses===6236&&d.results?.length===12&&d.next_offset===12);
          await fetchJson('/api/encyclopedia/answer?domain=seerah&q=What%20happened%20at%20the%20Battle%20of%20Badr%3F',d=>d.outcome==='full_article_answer'&&d.answer?.slug==='battle-of-badr-sourced-account'&&d.answer.citations?.length>=3);
          await fetchJson('/api/encyclopedia/answer?domain=prophetic_medicine&q=Does%20Prophetic%20Medicine%20cure%20asthma%3F',d=>d.outcome==='full_article_answer'&&d.answer?.slug==='asthma-prophetic-medicine-boundaries');
          await fetchJson('/api/unified-search?domain=seerah&q=What%20happened%20during%20the%20Hijrah%3F',d=>d.answer_brief&&d.answer_quality?.status==='published_reference_available'&&d.contextual_answers?.some(a=>a.slug==='hijrah-to-madinah'));
          console.log('SOFT RELEASE LIVE QA COMPLETE');
          JS
      - name: Automatic Worker rollback if live QA fails after deployment
        if: ${{ failure() && steps.release.outcome == 'success' }}
        run: |
          set -euo pipefail
          test -s /tmp/qst-last-safe-worker-version
          SAFE_VERSION="$(cat /tmp/qst-last-safe-worker-version)"
          npx wrangler rollback "$SAFE_VERSION" --name qst-living-knowledge-v1 --message "Automatic Quranically rollback after failed live QA"
          echo 'WARNING: Live QA failed and rollback was attempted. Verify active deployment before proceeding.' >> "$GITHUB_STEP_SUMMARY"
      - name: Record verified live release
        if: ${{ success() }}
        run: |
          echo '### Quranically existing Worker soft release PASSED' >> "$GITHUB_STEP_SUMMARY"
          echo '- Worker: qst-living-knowledge-v1 (existing)' >> "$GITHUB_STEP_SUMMARY"
          echo '- D1: qst-knowledge-v1-db (existing, unchanged during release)' >> "$GITHUB_STEP_SUMMARY"
          echo '- Canonical published content: 42+ articles, including 15 sourced new dossiers' >> "$GITHUB_STEP_SUMMARY"
          echo '- Tested public search, full Qur’an index, Seerah, medicine, homepage, reader and Admin route' >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '- Live: https://qst-living-knowledge-v1.stepinsaudia.workers.dev' >> "$GITHUB_STEP_SUMMARY"
