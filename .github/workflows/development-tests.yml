name: Quranically development quality gate
on:
  push:
    branches:
      - develop/equal-discipline-capability
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'migrations/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/development-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - name: Worker unit and isolated database migration tests
        run: npm test
      - name: Official HadeethEnc full-English-export schema probe (read-only)
        continue-on-error: true
        run: python3 scripts/hadeethenc-export-probe.py
      - name: OpenDua open source catalogue connectivity and schema
        continue-on-error: true
        run: node scripts/opendua-source-probe.mjs
      - name: Official category and clinical provider read-only connectivity
        continue-on-error: true
        run: node scripts/official-library-probe.mjs
      - name: Read-only production source availability diagnostics (nonblocking)
        continue-on-error: true
        run: node scripts/live-source-diagnostics.mjs
      - name: Static JavaScript syntax checks
        run: |
          node --check src/index.mjs
          node --check src/site-shell.mjs
          node --check src/source-discovery.mjs
          node --check src/knowledge-index.mjs
          node --check src/opendua-source.mjs
          node --check public/knowledge-admin.js
          node --check src/hadeethenc-library.mjs
          node --check public/source-shelves.js
          node --check public/answer.js
          node --check public/encyclopedia.js
          node --check public/admin.js
          node --check public/site-chrome.js
          node --check public/media-admin.js
          node --check scripts/development-visual-qa.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-package-lock
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Apply schema to isolated local D1
        run: npx wrangler d1 migrations apply qst-knowledge-v1-db --local
      - name: Start development Worker without deploying
        run: |
          nohup npx wrangler dev --local --port 8787 > wrangler-preview.log 2>&1 &
          for attempt in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat wrangler-preview.log
          exit 1
      - name: Retina desktop/mobile canonical public and Admin QA
        run: node scripts/development-visual-qa.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quranically-development-screenshots
          path: |
            artifacts/development/*.png
            wrangler-preview.log
          if-no-files-found: ignore
          retention-days: 5

  corpus-stage:
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[corpus]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build complete publisher SQL in ephemeral runner
        run: python3 scripts/build-hadeethenc-corpus.py /tmp/quranically-hadeethenc.sql
      - name: Validate all official records in temporary SQLite, no deployment
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db=sqlite3.connect(':memory:')
          db.executescript(Path('migrations/0024_knowledge_corpus_inverted_index.sql').read_text())
          db.executescript(Path('/tmp/quranically-hadeethenc.sql').read_text())
          n,distinct_ids=db.execute("SELECT COUNT(*),COUNT(DISTINCT external_ref) FROM knowledge_passages WHERE source_id='hadeethenc-en'").fetchone()
          edition=db.execute("SELECT version_label FROM knowledge_sources WHERE id='hadeethenc-en'").fetchone()[0]
          complete=db.execute("SELECT COUNT(*) FROM knowledge_passages WHERE source_id='hadeethenc-en' AND LENGTH(original_text)>0 AND LENGTH(translation_text)>0 AND LENGTH(source_url)>0 AND LENGTH(normalized_search)>0").fetchone()[0]
          assert n>=2000 and distinct_ids==n and complete==n and edition.startswith('v'),(n,distinct_ids,complete,edition)
          print('VERIFIED SOURCE CORPUS',n,'distinct, complete, unchanged publisher records; version',edition)
          PY
      - name: Verify actual full-corpus open-topic retrieval and citations
        run: node scripts/stage-corpus-search-test.mjs /tmp/quranically-hadeethenc.sql
      - name: Remove temporary proprietary/attributed material
        if: always()
        run: rm -f /tmp/quranically-hadeethenc.sql
