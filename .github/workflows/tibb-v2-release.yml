name: QURANICALLY CANONICAL V2 — Tibb Knowledge release
on:
  push:
    branches: [main]
    paths:
      - '.github/qst-tibb-v2-authorize.txt'
permissions:
  contents: read
concurrency:
  group: quranically-native-admin
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.event.head_commit.message == 'AUTHORIZE QURANICALLY TIBB V2 RELEASE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock deployment to existing isolated Quranically Worker and D1
        run: node scripts/native-admin-preflight.mjs
      - name: Install Wrangler
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run tests and static syntax checks before any production change
        run: |
          node --check src/index.mjs
          node --check public/admin.js
          node --check public/tibb.js
          node --check scripts/tibb-live-check.mjs
          npm test
      - name: Require Cloudflare and existing Admin secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          QST_ADMIN_PASSWORD: ${{ secrets.QST_ADMIN_PASSWORD }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Cloudflare token missing; no changes made'; exit 1; }
          node scripts/make-native-admin-record.mjs > /dev/null
          echo 'Authorized secrets present. No secret values printed.'
      - name: Apply ONLY this project Tibb migrations to existing D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: npx wrangler d1 migrations apply qst-knowledge-v1-db --remote
      - name: Deploy ONLY existing Quranically Worker and its assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: npx wrangler deploy
      - name: Accept live public frontend, Tibb API and protected canonical Admin
        env:
          QST_ADMIN_PASSWORD: ${{ secrets.QST_ADMIN_PASSWORD }}
        run: node scripts/tibb-live-check.mjs
