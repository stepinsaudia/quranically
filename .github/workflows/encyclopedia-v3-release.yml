name: QURANICALLY REFERENCE ENCYCLOPEDIA — Canonical V3 release
on:
  push:
    branches: [main]
    paths:
      - '.github/qst-encyclopedia-v3-authorize.txt'
permissions:
  contents: read
concurrency:
  group: quranically-native-admin
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.event.head_commit.message == 'AUTHORIZE QURANICALLY ENCYCLOPEDIA V3 RELEASE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify only existing isolated Quranically Worker and D1
        run: node scripts/native-admin-preflight.mjs
      - name: Install tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run all application tests before changing production
        run: |
          node --check src/index.mjs
          node --check public/admin.js
          node --check public/encyclopedia.js
          node --check scripts/encyclopedia-live-check.mjs
          npm test
      - name: Require private deployment and Admin credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          QST_ADMIN_PASSWORD: ${{ secrets.QST_ADMIN_PASSWORD }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare credential; no live changes'; exit 1; }
          node scripts/make-native-admin-record.mjs > /dev/null
          echo 'Credentials valid without disclosing secrets.'
      - name: Apply encyclopedia-only D1 migrations to existing database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: npx wrangler d1 migrations apply qst-knowledge-v1-db --remote
      - name: Deploy existing Quranically Worker and canonical frontend only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb9597e74bae3ea18ad7bb013213d776
        run: npx wrangler deploy
      - name: Confirm live encyclopedia, references, sessions, Admin and existing journeys
        env:
          QST_ADMIN_PASSWORD: ${{ secrets.QST_ADMIN_PASSWORD }}
        run: node scripts/encyclopedia-live-check.mjs
